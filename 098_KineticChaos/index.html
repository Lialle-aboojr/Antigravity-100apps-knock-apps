<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 1. 新しいAI生成ファビコンを優先して読み込む -->
    <link rel="icon" type="image/png" href="/favicon.png" id="main-favicon" />
    
    <!-- 2. 画像が読み込めない環境のための絶対確実なフォールバック（SVG絵文字の目玉） -->
    <script>
      const img = new Image();
      img.src = '/favicon.png';
      img.onerror = () => {
        // 画像読み込みに失敗した場合、Data URIの巨大な目玉(👁️)に差し替える
        document.getElementById('main-favicon').href = "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>";
      };
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic Chaos - Loading 99.9%...</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
